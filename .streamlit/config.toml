[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 650, 600, 600, 600]
baseRadius = "0.85rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#EEF2FA"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#DCE3F0"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4FA"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#151C30"
textColor = "#E6EAF2"
linkColor = "#93C5FD"
borderColor = "#26304A"

[theme.dark.sidebar]
backgroundColor = "#0F1628"
secondaryBackgroundColor = "#182038"
